name: Gmail sales candidate refresh

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target date in YYYY-MM-DD. Empty means JST today."
        required: false
        type: string

concurrency:
  group: gmail-sales-candidate-refresh-${{ inputs.target_date || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GMAIL_SALES_AUTOMATION_VERSION: ${{ vars.GMAIL_SALES_AUTOMATION_VERSION }}
      GMAIL_SALES_AUTO_APPROVAL_POLICY_VERSION: ${{ vars.GMAIL_SALES_AUTO_APPROVAL_POLICY_VERSION }}
      CANDIDATE_DISCOVERY_PROVIDER: ${{ vars.GMAIL_CANDIDATE_DISCOVERY_PROVIDER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Safety tests
        run: |
          npm run lint
          npm run gmail:pool:refresh:test
          npm run gmail:prospects:discover:test
          npm run gmail:source:sync:test
          npm run gmail:sales:send-safety:test

      - name: Check candidate discovery provider
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          if [ "$CANDIDATE_DISCOVERY_PROVIDER" != "google_places" ]; then
            echo '{"status":"blocked","errorCode":"candidate_discovery_provider_unconfigured"}'
            exit 1
          fi
          test -n "$GOOGLE_PLACES_API_KEY"

      - name: Refresh verified source candidates
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GMAIL_APPS_SCRIPT_WEBHOOK_URL: ${{ secrets.GMAIL_APPS_SCRIPT_WEBHOOK_URL }}
          GMAIL_AUTOMATION_SHARED_SECRET: ${{ secrets.GMAIL_AUTOMATION_SHARED_SECRET }}
        run: |
          TARGET_DATE="${{ inputs.target_date }}"
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE="$(TZ=Asia/Tokyo date +%F)"
          fi
          OUTPUT="${RUNNER_TEMP}/gmail-candidate-refresh/${TARGET_DATE}-verified-candidates.json"
          SUMMARY="${RUNNER_TEMP}/gmail-candidate-refresh/${TARGET_DATE}-discovery-summary.json"
          mkdir -p "$(dirname "$OUTPUT")"
          trap 'rm -rf "${RUNNER_TEMP}/gmail-candidate-refresh"' EXIT
          set +e
          npm run --silent gmail:prospects:discover -- --provider google_places --date "$TARGET_DATE" --required-count 45 --target-count 90 --max-provider-requests 30 --max-website-requests 1200 --website-concurrency 4 --max-verification-duration-ms 1500000 --write --output "$OUTPUT" --summary-file "$SUMMARY"
          DISCOVERY_EXIT=$?
          set -e
          if [ ! -f "$SUMMARY" ]; then
            echo '{"status":"failed","blockedReason":"discovery_summary_missing","sourceSyncExecuted":false}'
            exit 1
          fi
          set +e
          node scripts/gmail/validate-candidate-discovery-summary.mjs --summary "$SUMMARY" --output "$OUTPUT" --min-strict-eligible 45 --max-provider-requests 30 --max-website-requests 1200
          VALIDATION_EXIT=$?
          set -e
          if [ "$DISCOVERY_EXIT" -ne 0 ] || [ "$VALIDATION_EXIT" -ne 0 ]; then
            exit 1
          fi
          npm run gmail:source:sync -- --date "$TARGET_DATE" --input "$OUTPUT" --write
